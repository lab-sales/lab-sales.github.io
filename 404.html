<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Sales &amp; Incentive Dashboards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/portal.css">
<script>
  // Owner opt-out still works here: ?notrack=1 / ?notrack=0
  (function () {
    var p = new URLSearchParams(location.search);
    try {
      if (p.get("notrack") === "1") localStorage.setItem("pbi_notrack", "1");
      if (p.get("notrack") === "0") localStorage.removeItem("pbi_notrack");
    } catch (e) {}
    if (p.has("r") || p.has("notrack")) history.replaceState(null, "", location.pathname);
  })();
</script>
</head>
<body>
<main class="menu">
  <div class="brand"><span class="dot"></span>Sales &amp; Marketing</div>
  <h1>Sales &amp; incentive dashboards</h1>
  <p class="lede">Each team has its own private link. Open the link your team received by email to view your dashboard.</p>
  <p class="foot">Can't find your link? Contact the Data team in Sales &amp; Marketing.</p>
</main>
</body>
</html>
